[graph]
targets = []
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # Reached through the AWS SDK, which still builds on the hyper 0.14 client
    # stack and rustls 0.21. No release of aws-smithy-http-client moves off
    # either, so updating cannot resolve these. They sit on the path the
    # runtime uses to call AWS endpoints, not on the path it serves clients on.
    #
    # h2 0.3, unbounded empty DATA frames.
    "RUSTSEC-2026-0258",
    # rustls-webpki 0.101, name constraints for URI names were accepted.
    "RUSTSEC-2026-0098",
    # rustls-webpki 0.101, name constraints accepted for a wildcard name.
    "RUSTSEC-2026-0099",
    # rustls-webpki 0.101, panic parsing a certificate revocation list.
    "RUSTSEC-2026-0104",

    # PyO3 0.25, fixed in 0.29. That is several breaking releases away and
    # needs pyo3-async-runtimes and pythonize to move with it, so it is an
    # upgrade of its own rather than something to hold here indefinitely.
    #
    # Out of bounds read in the PyList and PyTuple iterators.
    "RUSTSEC-2026-0176",
    # Missing Sync bound on PyCFunction::new_closure closures.
    "RUSTSEC-2026-0177",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "MPL-2.0",
    "Apache-2.0 WITH LLVM-exception",
]

[[licenses.exceptions]]
allow = ["LicenseRef-sfio"]
crate = "sfio-promise"

[[licenses.exceptions]]
allow = ["LicenseRef-sfio"]
crate = "sfio-tokio-ffi"

[[licenses.exceptions]]
allow = ["LicenseRef-sfio"]
crate = "sfio-tracing-ffi"

[[licenses.clarify]]
crate = "sfio-promise"
expression = "LicenseRef-sfio"
license-files = [{ path = "LICENSE", hash = 0x652a8fff }]

[[licenses.clarify]]
crate = "sfio-tokio-ffi"
expression = "LicenseRef-sfio"
license-files = [{ path = "LICENSE", hash = 0x652a8fff }]

[[licenses.clarify]]
crate = "sfio-tracing-ffi"
expression = "LicenseRef-sfio"
license-files = [{ path = "LICENSE", hash = 0x652a8fff }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
