version: 2025-11-02
transform: celerity-2026-02-28
variables:
  logLevel:
    type: string
    description: "The log level to use for logging."
    default: "INFO"
    allowedValues:
      - "DEBUG"
      - "INFO"
      - "WARNING"
      - "ERROR"

resources:
  ordersWebSocketApi:
    type: "celerity/api"
    description: "A WebSocket API with a disconnect handler, so that closing a connection can be observed from the outside."
    metadata:
      displayName: Orders WebSocket API
    linkSelector:
      byLabel:
        application: "orders"
    spec:
      protocols: ["websocket"]
      tracingEnabled: false

  sendMessageHandler:
    type: "celerity/handler"
    metadata:
      displayName: Send Message Handler
      labels:
        application: "orders"
      annotations:
        celerity.handler.websocket: true
        celerity.handler.websocket.route: "sendMessage"
    spec:
      handlerName: Orders-SendMessageHandler-v1
      codeLocation: "./orders"
      handler: "handlers.send_message"
      runtime: "python3.12.x"
      memory: 1024
      # Deliberately short. A test that covers teardown has to outlast the
      # queued messages the connection is holding, so their timeouts are what
      # sets how long it runs for.
      timeout: 1
      tracingEnabled: false
      environmentVariables:
        LOG_LEVEL: "${variables.logLevel}"

  disconnectHandler:
    type: "celerity/handler"
    metadata:
      displayName: Disconnect Handler
      labels:
        application: "orders"
      annotations:
        celerity.handler.websocket: true
        celerity.handler.websocket.route: "$disconnect"
    spec:
      handlerName: Orders-DisconnectHandler-v1
      codeLocation: "./orders"
      handler: "handlers.disconnect"
      runtime: "python3.12.x"
      memory: 1024
      timeout: 1
      tracingEnabled: false
      environmentVariables:
        LOG_LEVEL: "${variables.logLevel}"
