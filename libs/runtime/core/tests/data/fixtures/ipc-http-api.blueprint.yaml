version: 2025-11-02
transform: celerity-2026-02-28
variables:
  logLevel:
    type: string
    description: "The log level to use for logging."
    default: "INFO"
    allowedValues:
      - "DEBUG"
      - "INFO"
      - "WARNING"
      - "ERROR"

resources:
  ordersApi:
    type: "celerity/api"
    description: "An HTTP API with no auth, so that IPC dispatch can be exercised on its own."
    metadata:
      displayName: Orders API
    linkSelector:
      byLabel:
        application: "orders"
    spec:
      protocols: ["http"]
      tracingEnabled: false

  getOrderHandler:
    type: "celerity/handler"
    metadata:
      displayName: Get Order Handler
      labels:
        application: "orders"
      annotations:
        celerity.handler.http: true
        celerity.handler.http.method: "GET"
        celerity.handler.http.path: "/orders/{orderId}"
    spec:
      handlerName: Orders-GetOrderHandler-v1
      codeLocation: "./orders"
      handler: "handlers.get_order"
      runtime: "python3.12.x"
      memory: 1024
      timeout: 60
      tracingEnabled: false
      environmentVariables:
        LOG_LEVEL: "${variables.logLevel}"

  createOrderHandler:
    type: "celerity/handler"
    metadata:
      displayName: Create Order Handler
      labels:
        application: "orders"
      annotations:
        celerity.handler.http: true
        celerity.handler.http.method: "POST"
        celerity.handler.http.path: "/orders"
    spec:
      handlerName: Orders-CreateOrderHandler-v1
      codeLocation: "./orders"
      handler: "handlers.create_order"
      runtime: "python3.12.x"
      memory: 1024
      # Deliberately short, so that timeout behaviour can be exercised without
      # a test having to wait out the 60 second default.
      timeout: 2
      tracingEnabled: false
      environmentVariables:
        LOG_LEVEL: "${variables.logLevel}"

  # No trigger annotations, so this is collected as a custom handler and is only
  # reachable by name through the local invoke endpoint.
  reindexHandler:
    type: "celerity/handler"
    metadata:
      displayName: Reindex Handler
      labels:
        application: "orders"
    spec:
      handlerName: Orders-ReindexHandler-v1
      codeLocation: "./orders"
      handler: "handlers.reindex"
      runtime: "python3.12.x"
      memory: 1024
      timeout: 2
      tracingEnabled: false
      environmentVariables:
        LOG_LEVEL: "${variables.logLevel}"
