version: v2
# Rust stubs are generated by the core crate's build script through
# tonic-prost-build, so that `cargo build` needs no extra tooling beyond
# protoc. This config is for generating stubs for SDKs in other languages, and
# for keeping `buf lint` and `buf breaking` available in CI.
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt: paths=source_relative
