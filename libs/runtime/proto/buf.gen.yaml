version: v2
# Rust stubs are not generated here. `celerity-proto-gen` compiles the contract
# with `buf build` and turns the descriptor set into Rust through
# tonic-prost-build, so that the output matches what the runtime expects. This
# config is for generating stubs for SDKs in other languages.
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt: paths=source_relative
