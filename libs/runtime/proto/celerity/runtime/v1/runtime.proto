syntax = "proto3";

// The contract between the Celerity runtime and a handlers executable running
// as a separate process, used by SDKs for ahead-of-time compiled languages.
//
// Everything the runtime needs in order to make a decision is typed. Everything
// else is `bytes`, which the runtime moves without inspecting. The runtime
// routes, times out, traces and meters on the envelope.
package celerity.runtime.v1;

// Ordered values for one parameter or header name.
//
// Order within a name is significant (RFC 9110 section 5.3); order across names
// is not. Protobuf maps cannot hold repeated values directly, so this wrapper
// carries them.
message Values {
  repeated string values = 1;
}

// ─────────────────────────── runtime → handler ───────────────────────────

message RuntimeMessage {
  oneof frame {
    // Sent first, before the handler's Ready, so an SDK can check the handlers
    // registered in code against the ones the blueprint declares.
    RuntimeConfig config = 1;
    ReadyAck ready_ack = 2;
    Dispatch dispatch = 3;
    Cancel cancel = 4;
    Drain drain = 5;
    // The reply to a handler-initiated invoke.
    InvokeResult invoke_result = 6;
    WsSendAck ws_ack = 7;
  }
}

// ─────────────────────────── handler → runtime ───────────────────────────

message HandlerMessage {
  oneof frame {
    Ready ready = 1;
    Result result = 2;
    CreditGrant credit = 3;
    InvokeRequest invoke = 4;
    WsSend ws_send = 5;
    Draining draining = 6;
  }
}

// Declares what this handler process serves and how much work it can take.
//
// The runtime does not dispatch until this arrives, which is the readiness
// signal a polling transport has no way to express.
message Ready {
  // The handler tags this process actually serves.
  repeated string handler_tags = 1;
  // Total events the runtime may have in flight to this process, across all
  // tags. SDKs should set this to their worker pool size: throughput saturates
  // there, and every unit beyond it adds latency for almost no throughput.
  uint32 initial_credit = 2;
  string sdk_version = 3;
  // Optional per-tag concurrency caps, so one slow tag cannot consume the whole
  // credit window and starve the others.
  repeated HandlerLimit limits = 4;
}

message HandlerLimit {
  string handler_tag = 1;
  uint32 max_concurrent = 2;
}

// Reports whether the handler's registered tags line up with the blueprint.
//
// A mismatch is a startup error here rather than a 404 in production.
message ReadyAck {
  bool accepted = 1;
  // Registered by the handler but absent from the blueprint.
  repeated string unknown_tags = 2;
  // Present in the blueprint but not registered by the handler.
  repeated string unhandled_tags = 3;
}

// Returns credit to the runtime.
//
// Credit is purely additive, it is consumed when the runtime dispatches and
// replenished only when the handler says so, never implicitly by a result
// arriving. Grants are normally included with Result;
// this frame exists for resizing the window,
// for grants not tied to a completion, and for resuming after a
// deliberate withhold.
message CreditGrant {
  uint32 additional = 1;
  // Absent means the global pool.
  optional string handler_tag = 2;
}

message Dispatch {
  string id = 1;
  string handler_tag = 2;
  uint64 timestamp_ms = 3;
  // When the runtime stops waiting for this event. The handler should treat it
  // as its own deadline; the runtime enforces it independently.
  int64 deadline_unix_ms = 4;
  // W3C traceparent and tracestate.
  map<string, string> trace_context = 5;

  oneof source {
    HttpRequest http = 10;
    WebSocketMessage websocket = 11;
    ConsumerBatch consumer = 12;
    ScheduleTrigger schedule = 13;
    CustomInvoke custom = 14;
  }
}

// Tells the handler to stop work nobody is waiting for.
//
// May arrive for an event that has already completed, which handlers must
// ignore rather than treat as an error.
message Cancel {
  string id = 1;

  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_DEADLINE_EXCEEDED = 1;
    // The originating caller went away: an HTTP client disconnected, or a
    // WebSocket connection closed.
    REASON_CALLER_GONE = 2;
    REASON_SHUTDOWN = 3;
  }

  Reason reason = 2;
}

// The runtime is going away: it stops dispatching and waits for in-flight work.
message Drain {
  int64 deadline_unix_ms = 1;
}

// The handler is going away, letting a supervisor roll handler processes
// without dropping work.
message Draining {
  int64 deadline_unix_ms = 1;
}

// ─────────────────────────────── HTTP ───────────────────────────────

message HttpRequest {
  // Uppercase and canonical.
  string method = 1;
  // Raw, percent-encoded as received.
  string path = 2;
  // The blueprint route template, e.g. /files/{path+}.
  string route = 3;
  // A catch-all parameter yields one value per path segment. Segments are split
  // from the raw path before being percent-decoded, so a segment containing an
  // encoded separator survives intact.
  map<string, Values> path_params = 4;
  map<string, Values> query_params = 5;
  // Names are lowercase.
  map<string, Values> headers = 6;
  string source_ip = 7;
  string request_id = 8;
  // Opaque. The runtime never parses this; the media type comes from the
  // content-type header.
  bytes body = 9;
}

message HttpResponse {
  uint32 status = 1;
  // Multi-valued, so a handler can emit two Set-Cookie headers, which RFC 9110
  // forbids folding into one comma-separated value.
  map<string, Values> headers = 2;
  bytes body = 3;
}

// ─────────────────────────── other sources ───────────────────────────

message WebSocketMessage {
  string route = 1;
  string connection_id = 2;
  string source_ip = 3;
  string request_id = 4;
  bytes message = 5;
  // Whether this arrived as a binary frame rather than a text one. A byte body
  // alone cannot express the distinction, and the WebSocket protocol treats
  // the two frame types as distinct.
  bool is_binary = 6;
}

message ConsumerBatch {
  repeated ConsumerRecord records = 1;
  string source_id = 2;
  string source_type = 3;
  // Provider-specific, opaque.
  bytes vendor = 4;
}

message ConsumerRecord {
  string message_id = 1;
  bytes body = 2;
  string source = 3;
  string event_type = 4;
  bytes attributes = 5;
  bytes vendor = 6;
}

message ScheduleTrigger {
  string schedule_id = 1;
  string message_id = 2;
  string schedule = 3;
  bytes input = 4;
  bytes vendor = 5;
}

message CustomInvoke {
  string handler_name = 1;
  bytes input = 2;
}

// ────────────────────────────── results ──────────────────────────────

message Result {
  string id = 1;
  // Credit returned along with this result. Zero withholds, telling the runtime
  // to stop dispatching to this stream until a later CreditGrant. SDKs should
  // default to 1 and must send this even when the handler panics, since a
  // missed grant drains the window and stalls the stream silently.
  uint32 credit_grant = 2;

  oneof outcome {
    HttpResponse http = 10;
    Ack websocket = 11;
    BatchResult consumer = 12;
    Ack schedule = 13;
    CustomInvokeResult custom = 14;
    // An unhandled error in user code.
    HandlerError error = 15;
  }
}

message Ack {
  bool success = 1;
  string error_message = 2;
}

message BatchResult {
  bool success = 1;
  repeated RecordFailure failures = 2;
}

message RecordFailure {
  string message_id = 1;
  string error_message = 2;
}

message CustomInvokeResult {
  bytes output = 1;
  string error_message = 2;
}

message HandlerError {
  string message = 1;
  string type = 2;
  string stack = 3;
}

// ──────────────────── side channels on the same stream ────────────────────

message WsSend {
  string correlation_id = 1;
  repeated WsOutbound messages = 2;
}

message WsOutbound {
  string connection_id = 1;
  bytes message = 2;
  bool is_binary = 3;
  repeated string inform_clients_on_loss = 4;
}

message WsSendAck {
  string correlation_id = 1;
  bool success = 2;
  string error_message = 3;
}

message InvokeRequest {
  string correlation_id = 1;
  string handler_name = 2;
  bytes input = 3;
  int64 deadline_unix_ms = 4;
}

message InvokeResult {
  string correlation_id = 1;
  bytes output = 2;
  string error_message = 3;
}

// ────────────────────────────── config ──────────────────────────────

message RuntimeConfig {
  bool tracing_enabled = 1;
  bool metrics_enabled = 2;
  repeated HandlerConfig handlers = 3;
}

message HandlerConfig {
  string handler_name = 1;
  string handler_tag = 2;
  int64 timeout_ms = 3;
  bool tracing_enabled = 4;
}

// One long-lived bidirectional stream carries everything: events, results,
// configuration, WebSocket sends, handler-to-handler invocation, cancellation
// and shutdown.
service HandlerRuntime {
  rpc EventStream(stream HandlerMessage) returns (stream RuntimeMessage);
}
