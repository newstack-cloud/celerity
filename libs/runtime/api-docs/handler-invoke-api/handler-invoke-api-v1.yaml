openapi: 3.1.0
info:
  title: Handler Invoke API
  description: |-
    This is the HTTP API that allows direct invocation
    of handlers running in the Celerity runtime.

    This API is designed for testing and debugging purposes in local development environments. This must **not** be enabled in production environments.
  version: 1.0.0

paths:
  /runtime/handlers/invoke:
    post:
      summary: Invoke a handler
      description: |
        Allows direct invocation of Celerity handler running in the Celerity runtime.

        This endpoint is useful for local testing allowing developers to bypass API or queue layers that trigger handlers.

        Where handlers run in a separate executable, the invocation is dispatched to that executable over the handler stream rather than being run in the runtime process. It is subject to the same timeout, capacity and cancellation handling as any other event, which is why the runtime may report that it could not be dispatched or did not complete in time.
      operationId: invokeHandler
      requestBody:
        $ref: "#/requestBodies/InvokeHandlerBody"
      responses:
        "200":
          description: |
            The response from the handler.
            For the `requestResponse` invocation type, this would be the response returned after the handler has completed processing.
            For the `async` invocation type, this an object with a message indicating that the handler has been invoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokeHandlerResponse"
        "400":
          description: |
            Invalid request parameters provided in payload, most likely an unsupported `invocationType`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestResponse"
        "404":
          description: |
            The handler could not be found in the current runtime.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundResponse"
        "500":
          description: |
            A server error occurred when trying to invoke the handler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorResponse"
        "503":
          description: |
            The runtime could not have the handler run at all, as opposed to running it and having it fail.
            No handlers executable is serving the handler, the runtime is at capacity, or it is shutting down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnavailableResponse"
        "504":
          description: |
            The handler was dispatched but did not return a result within its configured timeout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeoutResponse"

requestBodies:
  InvokeHandlerBody:
    content:
      application/json:
        schema:
          type: object
          required:
            - handlerName
            - invocationType
          properties:
            handlerName:
              type: string
              description: |
                The name for the handler as defined in the `spec.handlerName` field of a handler definition in a blueprint specification.
                The name of the blueprint resource the handler is declared as is also accepted, which is useful when `spec.handlerName` is not set.
              examples: ["Orders-GetOrder-v1"]
            invocationType:
              type: string
              description: |
                The type of invocation, can be one of `requestResponse` or `async`.
                Use `requestResponse` to wait for the handler to complete and return a response and `async` to return immediately without waiting for a response.
              enum:
                - requestResponse
                - async

components:
  schemas:
    InvokeHandlerResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: A message indicating that the handler has been invoked.
          examples: ["The handler has been invoked"]
        data:
          type: string
          description: |
            An optional string containing the response data returned from the invoked handler.
            In most cases this will be a serialised JSON object.
          examples:
            - "{\"status\":200,\"headers\":{\"Content-Type\":\"application/json\"},\"body\":{\\\"id\\\":40392}}"

    ServerErrorResponse:
      type: object
      properties:
        message:
          type: string
          examples: ["An unexpected error occurred"]

    NotFoundResponse:
      type: object
      properties:
        message:
          type: string
          examples: ["Handler not found"]

    BadRequestResponse:
      type: object
      properties:
        message:
          type: string
          examples: ["Invalid parameters in invoke payload"]

    UnavailableResponse:
      type: object
      properties:
        message:
          type: string
          examples: ["no handler is attached for this event"]

    TimeoutResponse:
      type: object
      properties:
        message:
          type: string
          examples: ["the handler did not respond within 60s"]
