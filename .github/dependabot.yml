version: 2

# The base images for every runtime and sidecar come from Docker Hardened
# Images, so Dependabot needs credentials of its own to see
# what tags exist. These are Dependabot secrets rather than Actions secrets,
# which are a separate store that Dependabot cannot read.
registries:
  dhi:
    type: docker-registry
    url: dhi.io
    username: ${{secrets.DOCKERHUB_USERNAME}}
    password: ${{secrets.DOCKERHUB_TOKEN}}

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"

  # Go modules - CLI
  - package-ecosystem: "gomod"
    directory: "/apps/cli"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(cli)"
    groups:
      go-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Rust - Runtime libraries
  - package-ecosystem: "cargo"
    directory: "/libs/runtime"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(runtime-libs)"
    groups:
      rust-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # NPM - Node.js runtime SDK
  - package-ecosystem: "npm"
    directory: "/libs/runtime/sdk/node"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(runtime-sdk-node)"
    groups:
      node-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # NPM - Node.js runtime wrapper
  - package-ecosystem: "npm"
    directory: "/apps/runtime/nodejs"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(runtime-nodejs)"
    groups:
      node-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # pip - Python runtime SDK
  - package-ecosystem: "pip"
    directory: "/libs/runtime"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(runtime-libs)"
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # pip - Python runtime wrapper
  - package-ecosystem: "pip"
    directory: "/apps/runtime/python"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(runtime-python)"
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Docker - Core runtime base images
  - package-ecosystem: "docker"
    directory: "/apps/runtime/core"
    registries:
      - dhi
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(runtime-core)"
    groups:
      docker-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Docker - Node.js runtime base images
  - package-ecosystem: "docker"
    directory: "/apps/runtime/nodejs"
    registries:
      - dhi
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(runtime-nodejs)"
    groups:
      docker-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Docker - Python runtime base images
  - package-ecosystem: "docker"
    directory: "/apps/runtime/python"
    registries:
      - dhi
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(runtime-python)"
    groups:
      docker-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Docker - Local events sidecar base images
  - package-ecosystem: "docker"
    directory: "/apps/local-events"
    registries:
      - dhi
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(local-events)"
    groups:
      docker-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Docker - Dev auth base images
  - package-ecosystem: "docker"
    directory: "/apps/dev-auth"
    registries:
      - dhi
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(dev-auth)"
    groups:
      docker-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
