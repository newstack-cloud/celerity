name: Celerity Local Events Sidecar Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. local-events/v0.3.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/container-release.yml
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      tag-component: local-events
      image-name: newstack-cloud/celerity-local-events
      context: apps/local-events
      cache-scope: local-events
      sarif-category: container-local-events
      targets: >-
        [
          {
            "name": "production",
            "tagPrefix": "",
            "block": true,
            "title": "Celerity Local Events Sidecar",
            "description": "Celerity Local Events Sidecar for local development and testing of Celerity applications"
          }
        ]
