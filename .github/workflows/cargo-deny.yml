name: Cargo Deny

on:
  push:
    branches: [main]
    paths:
      - "libs/runtime/**"
      - "apps/runtime/core/**"
  pull_request:
    paths:
      - "libs/runtime/**"
      - "apps/runtime/core/**"
  schedule:
    - cron: "0 5 * * 1" # Weekly Monday 5AM UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Cargo Deny Check (${{ matrix.manifest }})
    runs-on: ubuntu-latest
    strategy:
      # Every manifest and check should report on its own, rather than the
      # first failure hiding what the others would have said.
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
        # The core runtime app is a workspace of its own with its own lock
        # file, so the crates it ships are not covered by checking the runtime
        # libraries.
        manifest:
          - libs/runtime/Cargo.toml
          - apps/runtime/core/Cargo.toml
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # No `--config` here. Which position cargo-deny accepts it in differs
          # between releases, and the version the action ships is not the one a
          # contributor has locally. Each manifest has a deny.toml beside it
          # instead, which every version finds without being told.
          command: check ${{ matrix.checks }}
          manifest-path: ${{ matrix.manifest }}
