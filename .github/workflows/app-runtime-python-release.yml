name: Python Runtime Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. runtime-python/v0.3.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/container-release.yml
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      tag-component: runtime-python
      image-name: newstack-cloud/celerity-runtime-python-3-13
      context: apps/runtime/python
      cache-scope: runtime-python
      sarif-category: container-python
      targets: >-
        [
          {
            "name": "runtime",
            "tagPrefix": "",
            "block": true,
            "title": "Celerity Python Runtime",
            "description": "Production runtime for Celerity Python applications"
          },
          {
            "name": "dev",
            "tagPrefix": "dev-",
            "block": false,
            "title": "Celerity Python Runtime (Dev)",
            "description": "Development runtime for Celerity Python applications (includes watchfiles auto-reload)"
          }
        ]
