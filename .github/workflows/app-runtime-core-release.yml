name: Core Runtime Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. runtime-core-app/v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/container-release.yml
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      tag-component: runtime-core-app
      image-name: newstack-cloud/celerity-runtime-core
      # Built from the repository root, since the runtime is compiled from
      # sources that sit outside the app directory.
      context: .
      dockerfile: apps/runtime/core/Dockerfile
      cache-scope: runtime-core
      sarif-category: container-core
      targets: >-
        [
          {
            "name": "runtime",
            "tagPrefix": "",
            "block": true,
            "title": "Celerity Core Runtime",
            "description": "Runtime for Celerity applications with ahead-of-time compiled handlers"
          },
          {
            "name": "dev",
            "tagPrefix": "dev-",
            "block": false,
            "title": "Celerity Core Runtime (Dev)",
            "description": "Development runtime for Celerity applications with ahead-of-time compiled handlers"
          }
        ]
