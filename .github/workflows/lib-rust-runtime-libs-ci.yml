# This is the CI workflow for the Rust runtime libraries.
name: Runtime Libraries CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on:
  push:
    branches: [ main ]
    paths: 
      - 'libs/runtime/**'
  pull_request:
    branches: [ main ]
    paths: 
      - 'libs/runtime/**'
  workflow_dispatch:
    inputs: {}

jobs:
  protocol:
    # The IPC handler protocol and the Rust stubs generated from it. Kept
    # separate from the main job because it needs no Rust toolchain beyond
    # building the generator, and it should fail on its own terms.
    name: Protocol contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      working-directory: ./libs/runtime
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          # The drift check runs `git diff` and never writes back, so the token
          # does not need to be left behind in the checkout's git config.
          persist-credentials: false
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # Raises the GitHub API rate limit while the action resolves and
          # downloads a buf release, which shared runners otherwise hit. Not
          # authentication for the Buf Schema Registry, which nothing here uses.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint the protocol
        run: buf lint
        working-directory: ./libs/runtime/proto
      - name: Install Rust
        run: rustup update stable
      - name: Regenerate the stubs
        run: cargo run -p celerity-proto-gen
        working-directory: ${{env.working-directory}}
      # The stubs are checked in so that building the runtime needs no proto
      # tooling, which only holds if they match the contract they came from.
      # Regenerating and finding a change means the two have drifted apart.
      - name: Fail if the stubs have drifted
        run: |
          if ! git diff --exit-code -- libs/runtime/core/src/generated; then
            echo "::error::The checked-in stubs do not match the .proto. Run 'cargo run -p celerity-proto-gen' and commit the result."
            exit 1
          fi

  integrate:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      working-directory: ./libs/runtime
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      - name: Install cargo-llvm-cov and nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      # Python dependencies are required to run test service_test_tools.py script
      # that runs the integration tests.
      - name: Install Python dependencies
        run: uv sync --group dev
        working-directory: ${{env.working-directory}}
      - name: Linting
        run: ./scripts/lint.sh
        working-directory: ${{env.working-directory}}
      - name: Run tests
        run: |
          set -o allexport
          source .env.test
          set +o allexport
          uv run python scripts/package-test-tools.py --localdeps
        working-directory: ${{env.working-directory}}
        env:
          # provide mock AWS credentials, this is fine as long as the integration tests
          # don't need to access any real AWS services.
          AWS_ACCESS_KEY_ID: test-key
          AWS_SECRET_ACCESS_KEY: test-secret
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        with:
          projectBaseDir: ${{ env.working-directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
