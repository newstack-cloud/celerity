name: Node.js Runtime Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. runtime-nodejs/v0.9.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/container-release.yml
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      tag-component: runtime-nodejs
      image-name: newstack-cloud/celerity-runtime-nodejs-24
      context: apps/runtime/nodejs
      cache-scope: runtime-nodejs
      sarif-category: container-nodejs
      targets: >-
        [
          {
            "name": "runtime",
            "tagPrefix": "",
            "block": true,
            "title": "Celerity Node.js Runtime",
            "description": "Production runtime for Celerity Node.js applications"
          },
          {
            "name": "dev",
            "tagPrefix": "dev-",
            "block": false,
            "title": "Celerity Node.js Runtime (Dev)",
            "description": "Development runtime for Celerity Node.js applications (includes SWC, pino-pretty)"
          }
        ]
