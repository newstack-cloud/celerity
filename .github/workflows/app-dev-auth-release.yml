name: Celerity Dev Auth Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. dev-auth/v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/container-release.yml
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      tag-component: dev-auth
      image-name: newstack-cloud/celerity-dev-auth
      context: apps/dev-auth
      cache-scope: dev-auth
      sarif-category: container-dev-auth
      targets: >-
        [
          {
            "name": "production",
            "tagPrefix": "",
            "block": true,
            "title": "Celerity Dev Auth",
            "description": "Lightweight OIDC provider for local development and testing of Celerity applications"
          }
        ]
