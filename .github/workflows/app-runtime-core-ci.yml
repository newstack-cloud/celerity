name: Core Runtime CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/runtime/core/**'
      # The app is built from the runtime crates by path, so a change to them
      # can break this build without touching anything under apps/.
      - 'libs/runtime/**'
      - '.github/workflows/app-runtime-core-ci.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'apps/runtime/core/**'
      - 'libs/runtime/**'
      - '.github/workflows/app-runtime-core-ci.yml'
      - '!**/*.md'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/runtime/core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable && rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/runtime/core

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  docker-build:
    name: Docker Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [runtime, dev]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          # The repository root, because the build needs both apps/runtime/core
          # and the runtime crates it depends on under libs/runtime.
          context: .
          file: apps/runtime/core/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: celerity-runtime-core:${{ matrix.target }}-test
          cache-from: type=gha,scope=ci-core-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=ci-core-${{ matrix.target }}
