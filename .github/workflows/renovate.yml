name: Renovate

# Self-hosted Renovate runner.
# Focused rollout: Renovate owns version updates for the CLI's Go modules (the
# Bluelink dependency chain) via `includePaths` in renovate.json. Dependabot still
# handles the Rust/Node/Python runtime ecosystems (version updates) and security
# updates repo-wide. See RENOVATE.md.
on:
  schedule:
    # Hourly so the internal-cascade rule (which bypasses the weekly schedule)
    # can react promptly to upstream Bluelink lib releases.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        required: false
        default: "info"
      dryRun:
        description: "Dry run (full|null)"
        required: false
        default: "null"

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v41.0.0
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || 'null' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
